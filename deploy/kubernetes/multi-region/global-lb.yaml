apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-ingress
  namespace: flick
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # 启用全局路由
    global.traffic.manager/enabled: "true"
    # 区域权重
    global.traffic.manager/region-weights: |
      {
        "us-east-1": 100,
        "us-west-1": 100,
        "eu-west-1": 100,
        "ap-southeast-1": 100
      }
    # 地理位置路由
    global.traffic.manager/geo-routing: |
      {
        "US-EAST": "us-east-1",
        "US-WEST": "us-west-1",
        "EU": "eu-west-1",
        "ASIA": "ap-southeast-1",
        "DEFAULT": "us-east-1"
      }
    # 健康检查
    global.traffic.manager/health-check-path: "/health"
    global.traffic.manager/health-check-interval: "30s"
    # 延迟路由
    global.traffic.manager/latency-routing: "true"
    # 故障转移配置
    global.traffic.manager/failover-enabled: "true"
    global.traffic.manager/failover-strategy: "priority"
    global.traffic.manager/failover-priority: |
      {
        "us-east-1": ["us-west-1", "eu-west-1"],
        "us-west-1": ["us-east-1", "ap-southeast-1"],
        "eu-west-1": ["us-east-1", "ap-southeast-1"],
        "ap-southeast-1": ["us-west-1", "us-east-1"]
      }
spec:
  tls:
  - hosts:
    - api.flick.global
    secretName: flick-global-tls
  rules:
  - host: api.flick.global
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: global-gateway
            port:
              number: 80
---
# 全球服务发现
apiVersion: v1
kind: Service
metadata:
  name: global-gateway
  namespace: flick
  annotations:
    global.traffic.manager/multi-region: "true"
    global.traffic.manager/regions: "us-east-1,us-west-1,eu-west-1,ap-southeast-1"
    global.traffic.manager/us-east-1-service: "gateway-us-east"
    global.traffic.manager/us-west-1-service: "gateway-us-west"
    global.traffic.manager/eu-west-1-service: "gateway-eu-west"
    global.traffic.manager/ap-southeast-1-service: "gateway-ap-southeast"
spec:
  type: ExternalName
  externalName: gateway.flick.svc.cluster.local
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http 
apiVersion: v1
kind: ConfigMap
metadata:
  name: flick-config
  namespace: flick
data:
  db.host: "postgres-primary.flick.svc.cluster.local"
  db.port: "5432"
  db.name: "flick"
  redis.host: "redis-master.flick.svc.cluster.local"
  redis.port: "6379"
  log.level: "info"
  metrics.enabled: "true"
  tracing.enabled: "true"
  tracing.sampler: "0.2"
  app.region: "default"
---
apiVersion: v1
kind: Secret
metadata:
  name: flick-secrets
  namespace: flick
type: Opaque
data:
  # 这些值需要使用base64编码后填入
  db.user: cG9zdGdyZXM=  # postgres
  db.password: cGFzc3dvcmQxMjM= # password123
  redis.password: cmVkaXMxMjM= # redis123 
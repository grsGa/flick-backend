apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: flick
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 6  # 创建6个节点组成Redis集群（3主3从）
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: redis
        image: redis:7.0-alpine
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            # 生成Redis配置
            cat > /redis-conf/redis.conf <<EOF
            # Redis配置文件
            port 6379
            cluster-enabled yes
            cluster-config-file /data/nodes.conf
            cluster-node-timeout 5000
            dir /data
            appendonly yes
            appendfilename "appendonly.aof"
            appendfsync everysec
            save 900 1
            save 300 10
            save 60 10000
            maxmemory-policy allkeys-lru
            maxmemory 1gb
            maxmemory-samples 5
            protected-mode no
            requirepass $REDIS_PASSWORD
            masterauth $REDIS_PASSWORD
            # 启用持久化
            rdb-save-incremental-fsync yes
            rdb-compression yes
            # 启用集群
            cluster-require-full-coverage no
            # 提高性能设置
            io-threads 4
            io-threads-do-reads yes
            EOF
            
            # 启动Redis
            redis-server /redis-conf/redis.conf
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping | grep PONG
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flick-secrets
              key: redis.password
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-conf
          mountPath: /redis-conf
      volumes:
      - name: redis-conf
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi
---
# Redis集群服务
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: flick
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    name: redis
  - port: 16379
    name: cluster
  clusterIP: None
  selector:
    app: redis
---
# Redis创建集群的Job
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: flick
  labels:
    app: redis-cluster-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: redis-cluster-init
        image: redis:7.0-alpine
        command:
        - /bin/sh
        - -c
        - |
          # 等待所有Redis节点准备就绪
          echo "等待Redis节点准备就绪..."
          sleep 30
          
          # 检查每个节点的状态
          for i in {0..5}; do
            until redis-cli -h redis-$i.$REDIS_SERVICE -a $REDIS_PASSWORD ping | grep PONG; do
              echo "等待redis-$i.$REDIS_SERVICE准备就绪..."
              sleep 5
            done
          done
          
          # 创建集群
          echo "所有节点已准备就绪，开始创建集群..."
          
          echo yes | redis-cli --cluster create \
            redis-0.$REDIS_SERVICE:6379 \
            redis-1.$REDIS_SERVICE:6379 \
            redis-2.$REDIS_SERVICE:6379 \
            redis-3.$REDIS_SERVICE:6379 \
            redis-4.$REDIS_SERVICE:6379 \
            redis-5.$REDIS_SERVICE:6379 \
            -a $REDIS_PASSWORD \
            --cluster-replicas 1
          
          echo "Redis集群初始化成功"
        env:
        - name: REDIS_SERVICE
          value: redis.flick.svc.cluster.local
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flick-secrets
              key: redis.password
---
# Redis哨兵部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: flick
  labels:
    app: redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      containers:
      - name: sentinel
        image: redis:7.0-alpine
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            # 生成哨兵配置
            cat > /redis/sentinel.conf <<EOF
            port 26379
            sentinel monitor mymaster redis-0.redis 6379 2
            sentinel auth-pass mymaster $REDIS_PASSWORD
            sentinel down-after-milliseconds mymaster 5000
            sentinel parallel-syncs mymaster 1
            sentinel failover-timeout mymaster 10000
            EOF
            
            # 启动哨兵
            redis-sentinel /redis/sentinel.conf
        ports:
        - containerPort: 26379
          name: sentinel
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flick-secrets
              key: redis.password
        volumeMounts:
        - name: sentinel-data
          mountPath: /redis
      volumes:
      - name: sentinel-data
        emptyDir: {}
---
# Redis哨兵服务
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: flick
  labels:
    app: redis-sentinel
spec:
  ports:
  - port: 26379
    name: sentinel
  selector:
    app: redis-sentinel 
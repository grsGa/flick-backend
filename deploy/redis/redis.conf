# Redis 配置文件，用于防止缓存雪崩和提高可用性

# 基本配置
port 6379
bind 0.0.0.0
protected-mode yes
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice

# 密码设置 (在启动时通过环境变量传入)
requirepass ${REDIS_PASSWORD}

# 持久化配置 - 同时启用RDB和AOF实现数据安全性
# RDB持久化
save 900 1    # 900秒内至少有1个key发生变化，触发保存
save 300 10   # 300秒内至少有10个key发生变化，触发保存
save 60 10000 # 60秒内至少有10000个key发生变化，触发保存
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # 每秒同步一次
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# 内存管理 - 防止OOM
maxmemory 1gb
maxmemory-policy allkeys-lru  # 内存不足时，删除最久未使用的键
maxmemory-samples 5

# 防止缓存雪崩配置
# 1. 超时时间随机化 (应用层实现)
# 2. 热点数据永不过期
# 3. 限制请求数量
maxclients 10000

# 性能优化
tcp-keepalive 300
tcp-backlog 511
timeout 0
io-threads 4
io-threads-do-reads yes
hz 10
dynamic-hz yes

# 集群配置 (哨兵模式或集群模式在运行时配置)
cluster-enabled no
cluster-node-timeout 5000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage no

# 慢查询配置
slowlog-log-slower-than 10000  # 记录执行时间超过10毫秒的查询
slowlog-max-len 128           # 保留最近128条慢查询记录

# 延迟监控
latency-monitor-threshold 100  # 监控执行时间超过100毫秒的操作

# 高级功能
# 启用Lua脚本
lua-time-limit 5000

# 防止内存碎片
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100 
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8081']

  - job_name: 'content-service'
    static_configs:
      - targets: ['content-service:8082']

  - job_name: 'interaction-service'
    static_configs:
      - targets: ['interaction-service:8083']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8084']

  - job_name: 'recommendation-service'
    static_configs:
      - targets: ['recommendation-service:8085']
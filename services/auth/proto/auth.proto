syntax = "proto3";

package auth;
option go_package = "./proto";

// AuthService 定义认证服务
service AuthService {
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // 验证令牌
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // 刷新令牌
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // 登出
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Github登录
  rpc GithubLogin(GithubLoginRequest) returns (GithubLoginResponse);

  // Github回调
  rpc GithubCallback(GithubCallbackRequest) returns (GithubCallbackResponse);

  // Google登录
  rpc GoogleLogin(GoogleLoginRequest) returns (GoogleLoginResponse);

  // Google回调
  rpc GoogleCallback(GoogleCallbackRequest) returns (GoogleCallbackResponse);
}

// 登录请求
message LoginRequest {
  string identifier = 1; // 用户名、邮箱或手机号
  string password = 2;
}

// 登录响应
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  User user = 5;
  Error error = 6;
}

// 注册请求
message RegisterRequest {
  string username = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
  string display_name = 5;
  string login_method = 6;
}

// 注册响应
message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  User user = 5;
  Error error = 6;
}

// 验证令牌请求
message ValidateTokenRequest {
  string token = 1;
}

// 验证令牌响应
message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  Error error = 3;
}

// 刷新令牌请求
message RefreshTokenRequest {
  string refresh_token = 1;
}

// 刷新令牌响应
message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  Error error = 5;
}

// 登出请求
message LogoutRequest {
  string user_id = 1;
}

// 登出响应
message LogoutResponse {
  bool success = 1;
  Error error = 2;
}

// Github登录请求
message GithubLoginRequest {}

// Github登录响应
message GithubLoginResponse {
  string redirect_url = 1;
}

// Github回调请求
message GithubCallbackRequest {
  string code = 1;
}

// Github回调响应
message GithubCallbackResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  User user = 5;
  Error error = 6;
}

// Google登录请求
message GoogleLoginRequest {}

// Google登录响应
message GoogleLoginResponse {
  string redirect_url = 1;
}

// Google回调请求
message GoogleCallbackRequest {
  string code = 1;
}

// Google回调响应
message GoogleCallbackResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  User user = 5;
  Error error = 6;
}

// 用户信息
message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  string avatar_url = 6;
  string cover_url = 7;
  string bio = 8;
  string location = 9;
  string website_url = 10;
  bool is_email_verified = 11;
  bool is_phone_verified = 12;
  string login_method = 13;
  string last_login_at = 14;
  string status = 15;
  string created_at = 16;
  string updated_at = 17;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}

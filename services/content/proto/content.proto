syntax = "proto3";

package content;
option go_package = "./proto";

// ContentService 定义内容服务
service ContentService {
  // 创建帖子
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  
  // 获取帖子
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  
  // 获取用户帖子列表
  rpc GetUserPosts(GetUserPostsRequest) returns (GetUserPostsResponse);
  
  // 获取时间线
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
  
  // 删除帖子
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  
  // 检查回复权限
  rpc CheckReplyPermission(CheckReplyPermissionRequest) returns (CheckReplyPermissionResponse);
}

// 帖子信息
message Post {
  string id = 1;
  string user_id = 2;
  string content = 3;
  string visibility = 4; // public, private, followers
  string reply_permission = 5; // EVERYONE, FOLLOWING, MENTIONED_ONLY
  string parent_id = 6; // 回复的帖子ID
  string repost_id = 7; // 转发的帖子ID
  bool has_media = 8;
  bool has_poll = 9;
  repeated MediaAttachment media_attachments = 10;
  repeated string mentioned_users = 11; // 被@的用户ID列表
  repeated string tags = 12; // 标签列表
  Poll poll = 13; // 投票信息
  PostStats stats = 14; // 统计信息
  string created_at = 15;
  string updated_at = 16;
  Author author = 17; // 作者信息
}

// 作者信息
message Author {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool is_verified = 5;
}

// 媒体附件
message MediaAttachment {
  string id = 1;
  string url = 2;
  string type = 3; // image, video, gif, avatar, banner
  string alt_text = 4;
  string created_at = 5;
}

// 投票信息
message Poll {
  string id = 1;
  string question = 2;
  repeated PollOption options = 3;
  int32 duration_minutes = 4;
  string expires_at = 5;
  string created_at = 6;
}

// 投票选项
message PollOption {
  string id = 1;
  string text = 2;
  int32 position = 3;
  int32 vote_count = 4;
}

// 帖子统计
message PostStats {
  int32 like_count = 1;
  int32 comment_count = 2;
  int32 repost_count = 3;
  int32 view_count = 4;
}

// 创建帖子请求
message CreatePostRequest {
  string user_id = 1;
  string content = 2;
  string visibility = 3; // public, private, followers
  string reply_permission = 4; // EVERYONE, FOLLOWING, MENTIONED_ONLY
  string parent_id = 5; // 回复的帖子ID (可选)
  string repost_id = 6; // 转发的帖子ID (可选)
  repeated string media_urls = 7; // 媒体文件URL列表
  repeated string mentioned_users = 8; // 被@的用户ID列表
  repeated string tags = 9; // 标签列表
  PollData poll_data = 10; // 投票数据 (可选)
}

// 投票数据
message PollData {
  string question = 1;
  repeated string options = 2;
  int32 duration_minutes = 3;
}

// 创建帖子响应
message CreatePostResponse {
  Post post = 1;
  Error error = 2;
}

// 获取帖子请求
message GetPostRequest {
  string post_id = 1;
  string requesting_user_id = 2; // 用于权限检查
}

// 获取帖子响应
message GetPostResponse {
  Post post = 1;
  Error error = 2;
}

// 获取用户帖子列表请求
message GetUserPostsRequest {
  string user_id = 1;
  string requesting_user_id = 2; // 用于权限检查
  int32 limit = 3;
  string cursor = 4; // 分页游标
}

// 获取用户帖子列表响应
message GetUserPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
  Error error = 4;
}

// 获取时间线请求
message GetTimelineRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3; // 分页游标
}

// 获取时间线响应
message GetTimelineResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
  Error error = 4;
}

// 删除帖子请求
message DeletePostRequest {
  string post_id = 1;
  string user_id = 2; // 验证权限
}

// 删除帖子响应
message DeletePostResponse {
  bool success = 1;
  Error error = 2;
}

// 检查回复权限请求
message CheckReplyPermissionRequest {
  string post_id = 1;
  string user_id = 2; // 想要回复的用户ID
}

// 检查回复权限响应
message CheckReplyPermissionResponse {
  bool can_reply = 1;
  string reason = 2; // 如果不能回复，说明原因
  Error error = 3;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}
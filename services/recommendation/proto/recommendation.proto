syntax = "proto3";

package recommendation;
option go_package = "github.com/flick/backend/services/recommendation/proto";

// RecommendationService 定义推荐服务
service RecommendationService {
  // 获取推荐内容
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  
  // 记录用户行为
  rpc RecordUserAction(RecordUserActionRequest) returns (RecordUserActionResponse);
  
  // 更新用户兴趣
  rpc UpdateUserInterest(UpdateUserInterestRequest) returns (UpdateUserInterestResponse);
}

// 推荐项
message RecommendationItem {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  double score = 4;
  string created_at = 5;
}

// 获取推荐内容请求
message GetRecommendationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

// 获取推荐内容响应
message GetRecommendationsResponse {
  repeated RecommendationItem items = 1;
  Error error = 2;
}

// 记录用户行为请求
message RecordUserActionRequest {
  string user_id = 1;
  string post_id = 2;
  string action_type = 3; // view, like, share, comment
  double weight = 4;
}

// 记录用户行为响应
message RecordUserActionResponse {
  bool success = 1;
  Error error = 2;
}

// 更新用户兴趣请求
message UpdateUserInterestRequest {
  string user_id = 1;
  map<string, double> interests = 2; // tag -> weight
}

// 更新用户兴趣响应
message UpdateUserInterestResponse {
  bool success = 1;
  Error error = 2;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}
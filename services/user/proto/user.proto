syntax = "proto3";

package user;
option go_package = "github.com/flick/backend/services/user/proto";

// UserService 定义用户服务
service UserService {
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);

  // 获取用户信息
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // 根据用户名获取用户信息
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserResponse);
  
  // 更新用户
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  
  // 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // 获取关注者
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);

  // 获取正在关注
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);

  // 更新个人资料
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // 关注用户
  rpc FollowUser(FollowUserRequest) returns (FollowUserResponse);

  // 取消关注用户
  rpc UnfollowUser(UnfollowUserRequest) returns (UnfollowUserResponse);

  // 更新用户头像版本
  rpc UpdateUserAvatar(UpdateUserAvatarRequest) returns (UpdateUserAvatarResponse);

  // 更新用户横幅版本
  rpc UpdateUserBanner(UpdateUserBannerRequest) returns (UpdateUserBannerResponse);
}

// 用户信息
message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  string password_hash = 6;
  string avatar_url = 7;
  int32 avatar_version = 8;
  string banner_url = 9;
  int32 banner_version = 10;
  string bio = 11;
  string location = 12;
  string website_url = 13;
  bool is_email_verified = 14;
  bool is_phone_verified = 15;
  string login_method = 16;
  string last_login_at = 17;
  string status = 18;
  string created_at = 19;
  string updated_at = 20;
  int32 followers_count = 21;
  int32 following_count = 22;
  bool is_following = 23;
  bool is_verified = 24;
}

// 获取用户请求
message GetUserRequest {
  string user_id = 1;
}

// 获取用户响应
message GetUserResponse {
  User user = 1;
  Error error = 2;
}

// 根据用户名获取用户请求
message GetUserByUsernameRequest {
  string username = 1;
}

// 更新用户请求
message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  string avatar_url = 6;
  string banner_url = 7;
  string bio = 8;
  string location = 9;
  string website_url = 10;
  string status = 11;
}

// 更新用户响应
message UpdateUserResponse {
  User user = 1;
  Error error = 2;
}

// 删除用户请求
message DeleteUserRequest {
  string user_id = 1;
}

// 删除用户响应
message DeleteUserResponse {
  bool success = 1;
  Error error = 2;
}

// 注册请求
message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
}

// 注册响应
message RegisterResponse {
  string token = 1;
  User user = 2;
  Error error = 3;
}

// 登录请求
message LoginRequest {
    string identifier = 1;
    string password = 2;
}

// 登录响应
message LoginResponse {
  string token = 1;
  User user = 2;
  Error error = 3;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}

// 获取关注者请求
message GetFollowersRequest {
  string user_id = 1;
  int32 first = 2;
  string after = 3;
}

// 获取关注者响应
message GetFollowersResponse {
  repeated User users = 1;
  PageInfo page_info = 2;
  Error error = 3;
}

// 获取正在关注请求
message GetFollowingRequest {
  string user_id = 1;
  int32 first = 2;
  string after = 3;
}

// 获取正在关注响应
message GetFollowingResponse {
  repeated User users = 1;
  PageInfo page_info = 2;
  Error error = 3;
}

// 分页信息
message PageInfo {
  bool has_next_page = 1;
  string end_cursor = 2;
}

// 更新个人资料请求
message UpdateProfileRequest {
  string user_id = 1;
  optional string display_name = 2;
  optional string bio = 3;
  optional string location = 4;
  optional string website = 5;
  optional string avatar_url = 6;
  optional string banner_url = 7;
}

// 更新个人资料响应
message UpdateProfileResponse {
  User user = 1;
  Error error = 2;
}

// 关注用户请求
message FollowUserRequest {
  string follower_id = 1;
  string following_id = 2;
}

// 关注用户响应
message FollowUserResponse {
  User user = 1;
  Error error = 2;
}

// 取消关注用户请求
message UnfollowUserRequest {
  string follower_id = 1;
  string following_id = 2;
}

// 取消关注用户响应
message UnfollowUserResponse {
  User user = 1;
  Error error = 2;
}

// 更新用户头像请求
message UpdateUserAvatarRequest {
  string user_id = 1;
  string avatar_url = 2;
  int32 avatar_version = 3;
}

// 更新用户头像响应
message UpdateUserAvatarResponse {
  User user = 1;
  Error error = 2;
}

// 更新用户横幅请求
message UpdateUserBannerRequest {
  string user_id = 1;
  string banner_url = 2;
  int32 banner_version = 3;
}

// 更新用户横幅响应
message UpdateUserBannerResponse {
  User user = 1;
  Error error = 2;
}

syntax = "proto3";

package user;
option go_package = "./proto";

// UserService 定义用户服务
service UserService {
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);

  // 获取用户信息
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // 根据用户名获取用户信息
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserResponse);
  
  // 更新用户
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  
  // 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // 获取关注者
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);

  // 获取正在关注
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);
}

// 用户信息
message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  string password_hash = 6;
  string avatar_url = 7;
  string banner_url = 8;
  string bio = 9;
  string location = 10;
  string website_url = 11;
  bool is_email_verified = 12;
  bool is_phone_verified = 13;
  string login_method = 14;
  string last_login_at = 15;
  string status = 16;
  string created_at = 17;
  string updated_at = 18;
  int32 followers_count = 19;
  int32 following_count = 20;
  bool is_following = 21;
  bool is_verified = 22;
}

// 获取用户请求
message GetUserRequest {
  string user_id = 1;
}

// 获取用户响应
message GetUserResponse {
  User user = 1;
  Error error = 2;
}

// 根据用户名获取用户请求
message GetUserByUsernameRequest {
  string username = 1;
}

// 更新用户请求
message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string phone = 5;
  string avatar_url = 6;
  string banner_url = 7;
  string bio = 8;
  string location = 9;
  string website_url = 10;
  string status = 11;
}

// 更新用户响应
message UpdateUserResponse {
  User user = 1;
  Error error = 2;
}

// 删除用户请求
message DeleteUserRequest {
  string user_id = 1;
}

// 删除用户响应
message DeleteUserResponse {
  bool success = 1;
  Error error = 2;
}

// 注册请求
message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
}

// 注册响应
message RegisterResponse {
  string token = 1;
  User user = 2;
  Error error = 3;
}

// 登录请求
message LoginRequest {
    string identifier = 1;
    string password = 2;
}

// 登录响应
message LoginResponse {
  string token = 1;
  User user = 2;
  Error error = 3;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}

// 获取关注者请求
message GetFollowersRequest {
  string user_id = 1;
  int32 first = 2;
  string after = 3;
}

// 获取关注者响应
message GetFollowersResponse {
  repeated User users = 1;
  PageInfo page_info = 2;
  Error error = 3;
}

// 获取正在关注请求
message GetFollowingRequest {
  string user_id = 1;
  int32 first = 2;
  string after = 3;
}

// 获取正在关注响应
message GetFollowingResponse {
  repeated User users = 1;
  PageInfo page_info = 2;
  Error error = 3;
}

// 分页信息
message PageInfo {
  bool has_next_page = 1;
  string end_cursor = 2;
}

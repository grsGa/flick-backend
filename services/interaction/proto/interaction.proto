syntax = "proto3";

package interaction;
option go_package = "./proto";

// InteractionService 定义互动服务
service InteractionService {
  // 创建关注
  rpc CreateFollow(CreateFollowRequest) returns (CreateFollowResponse);
  
  // 删除关注
  rpc DeleteFollow(DeleteFollowRequest) returns (DeleteFollowResponse);
  
  // 检查是否关注
  rpc IsFollowing(IsFollowingRequest) returns (IsFollowingResponse);
  
  // 获取粉丝列表
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);
  
  // 获取关注列表
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);
  
  // 创建点赞
  rpc CreateLike(CreateLikeRequest) returns (CreateLikeResponse);
  
  // 删除点赞
  rpc DeleteLike(DeleteLikeRequest) returns (DeleteLikeResponse);
  
  // 检查是否点赞
  rpc IsLiked(IsLikedRequest) returns (IsLikedResponse);
  
  // 获取点赞列表
  rpc GetLikes(GetLikesRequest) returns (GetLikesResponse);
  
  // 创建评论
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  
  // 删除评论
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  
  // 获取评论列表
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  
  // 创建转发
  rpc CreateRepost(CreateRepostRequest) returns (CreateRepostResponse);
  
  // 删除转发
  rpc DeleteRepost(DeleteRepostRequest) returns (DeleteRepostResponse);
  
  // 获取帖子统计
  rpc GetPostStats(GetPostStatsRequest) returns (GetPostStatsResponse);
  
  // 更新帖子统计
  rpc UpdatePostStats(UpdatePostStatsRequest) returns (UpdatePostStatsResponse);
  
  // 投票
  rpc VotePoll(VotePollRequest) returns (VotePollResponse);
  
  // 创建举报
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);
}

// 关注关系
message Follow {
  string id = 1;
  string follower_id = 2;
  string followee_id = 3;
  string created_at = 4;
}

// 点赞
message Like {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  string created_at = 4;
}

// 评论
message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  string content = 4;
  string parent_comment_id = 5; // 楼中楼回复
  string created_at = 6;
  string updated_at = 7;
}

// 转发
message Repost {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  string comment = 4;
  string created_at = 5;
}

// 帖子统计
message PostStats {
  string post_id = 1;
  int32 like_count = 2;
  int32 comment_count = 3;
  int32 repost_count = 4;
  int32 view_count = 5;
  string updated_at = 6;
}

// 投票记录
message PollVote {
  string id = 1;
  string poll_id = 2;
  string poll_option_id = 3;
  string user_id = 4;
  string created_at = 5;
}

// 举报
message Report {
  string id = 1;
  string user_id = 2;
  string target_id = 3;
  string target_type = 4; // post, user, comment
  string reason = 5;
  string created_at = 6;
}

// 创建关注请求
message CreateFollowRequest {
  string follower_id = 1;
  string followee_id = 2;
}

// 创建关注响应
message CreateFollowResponse {
  Follow follow = 1;
  Error error = 2;
}

// 删除关注请求
message DeleteFollowRequest {
  string follower_id = 1;
  string followee_id = 2;
}

// 删除关注响应
message DeleteFollowResponse {
  bool success = 1;
  Error error = 2;
}

// 检查是否关注请求
message IsFollowingRequest {
  string follower_id = 1;
  string followee_id = 2;
}

// 检查是否关注响应
message IsFollowingResponse {
  bool is_following = 1;
  Error error = 2;
}

// 获取粉丝列表请求
message GetFollowersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 获取粉丝列表响应
message GetFollowersResponse {
  repeated Follow followers = 1;
  int32 total = 2;
  Error error = 3;
}

// 获取关注列表请求
message GetFollowingRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 获取关注列表响应
message GetFollowingResponse {
  repeated Follow following = 1;
  int32 total = 2;
  Error error = 3;
}

// 创建点赞请求
message CreateLikeRequest {
  string user_id = 1;
  string post_id = 2;
}

// 创建点赞响应
message CreateLikeResponse {
  Like like = 1;
  Error error = 2;
}

// 删除点赞请求
message DeleteLikeRequest {
  string user_id = 1;
  string post_id = 2;
}

// 删除点赞响应
message DeleteLikeResponse {
  bool success = 1;
  Error error = 2;
}

// 检查是否点赞请求
message IsLikedRequest {
  string user_id = 1;
  string post_id = 2;
}

// 检查是否点赞响应
message IsLikedResponse {
  bool is_liked = 1;
  Error error = 2;
}

// 获取点赞列表请求
message GetLikesRequest {
  string post_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 获取点赞列表响应
message GetLikesResponse {
  repeated Like likes = 1;
  int32 total = 2;
  Error error = 3;
}

// 创建转发请求
message CreateRepostRequest {
  string user_id = 1;
  string post_id = 2;
  string comment = 3;
}

// 创建转发响应
message CreateRepostResponse {
  Repost repost = 1;
  Error error = 2;
}

// 删除转发请求
message DeleteRepostRequest {
  string user_id = 1;
  string post_id = 2;
}

// 删除转发响应
message DeleteRepostResponse {
  bool success = 1;
  Error error = 2;
}

// 创建评论请求
message CreateCommentRequest {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  string parent_comment_id = 4; // 可选，楼中楼回复
}

// 创建评论响应
message CreateCommentResponse {
  Comment comment = 1;
  Error error = 2;
}

// 删除评论请求
message DeleteCommentRequest {
  string comment_id = 1;
  string user_id = 2; // 验证权限
}

// 删除评论响应
message DeleteCommentResponse {
  bool success = 1;
  Error error = 2;
}

// 获取评论列表请求
message GetCommentsRequest {
  string post_id = 1;
  int32 limit = 2;
  string cursor = 3; // 分页游标
}

// 获取评论列表响应
message GetCommentsResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
  Error error = 4;
}

// 获取帖子统计请求
message GetPostStatsRequest {
  string post_id = 1;
}

// 获取帖子统计响应
message GetPostStatsResponse {
  PostStats stats = 1;
  Error error = 2;
}

// 更新帖子统计请求
message UpdatePostStatsRequest {
  string post_id = 1;
  string action = 2; // like, unlike, comment, uncomment, repost, unrepost, view
  int32 delta = 3; // +1 or -1
}

// 更新帖子统计响应
message UpdatePostStatsResponse {
  PostStats stats = 1;
  Error error = 2;
}

// 投票请求
message VotePollRequest {
  string poll_id = 1;
  string poll_option_id = 2;
  string user_id = 3;
}

// 投票响应
message VotePollResponse {
  PollVote vote = 1;
  Error error = 2;
}

// 创建举报请求
message CreateReportRequest {
  string user_id = 1;
  string target_id = 2;
  string target_type = 3;
  string reason = 4;
}

// 创建举报响应
message CreateReportResponse {
  Report report = 1;
  Error error = 2;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}
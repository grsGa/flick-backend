syntax = "proto3";

package bookmark;
option go_package = "./proto";

// BookmarkService 定义书签服务
service BookmarkService {
  // 创建书签
  rpc CreateBookmark(CreateBookmarkRequest) returns (CreateBookmarkResponse);
  
  // 删除书签
  rpc DeleteBookmark(DeleteBookmarkRequest) returns (DeleteBookmarkResponse);
  
  // 检查是否已收藏
  rpc IsBookmarked(IsBookmarkedRequest) returns (IsBookmarkedResponse);
  
  // 获取用户书签列表
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse);
}

// 书签
message Bookmark {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  string created_at = 4;
}

// 创建书签请求
message CreateBookmarkRequest {
  string user_id = 1;
  string post_id = 2;
}

// 创建书签响应
message CreateBookmarkResponse {
  Bookmark bookmark = 1;
  Error error = 2;
}

// 删除书签请求
message DeleteBookmarkRequest {
  string user_id = 1;
  string post_id = 2;
}

// 删除书签响应
message DeleteBookmarkResponse {
  bool success = 1;
  Error error = 2;
}

// 检查是否已收藏请求
message IsBookmarkedRequest {
  string user_id = 1;
  string post_id = 2;
}

// 检查是否已收藏响应
message IsBookmarkedResponse {
  bool is_bookmarked = 1;
  Error error = 2;
}

// 获取用户书签列表请求
message ListBookmarksRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 获取用户书签列表响应
message ListBookmarksResponse {
  repeated Bookmark bookmarks = 1;
  int32 total = 2;
  Error error = 3;
}

// 错误信息
message Error {
  int32 code = 1;
  string message = 2;
}